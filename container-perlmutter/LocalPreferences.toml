# Perlmutter CUDA 12 deployment preferences for the GB-25 container image.
#
# CUDA_Runtime_jll is configured to use the CUDA runtime supplied by the
# container/Perlmutter runtime injection instead of Julia-managed CUDA runtime artifacts.
# Reactant_jll v0.0.387+0 uses gpu_version as its CUDA artifact selector key.

[CUDA_Runtime_jll]
local = "true"
version = "12.9"

[Reactant_jll]
gpu = "cuda"
gpu_version = "12.9"
mode = "opt"

[MPIPreferences]
_format = "1.0"
abi = "MPICH"
binary = "system"
libmpi = "/opt/udiImage/modules/mpich/libmpi.so"
mpiexec = "srun"
