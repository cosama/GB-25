# NERSC CUDA 13 deployment preferences for the GB-25 container image.
#
# CUDA_Runtime_jll is configured to use the CUDA runtime supplied by the
# container/NERSC injection instead of Julia-managed CUDA runtime artifacts.
# Reactant_jll v0.0.387+0 uses gpu_version as its CUDA artifact selector key.

[CUDA_Runtime_jll]
local = "true"
version = "13.1"

[Reactant_jll]
gpu = "cuda"
gpu_version = "13.1"
mode = "opt"
